<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auto Parts Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        AutoParts
        <div class="logo-sub">North America marketplace</div>
      </div>
      <div class="header-actions">
        <button class="hbtn primary" id="loginBtn">Login</button>
        <button class="hbtn" id="registerBtn">Register</button>
      </div>
    </header>

    <section class="hero-strip">
      <div>
        <div class="hero-title">Find rust‑free, winter‑ready parts across Canada & the US</div>
        <div class="hero-desc">
          Browse cross‑border listings with duty estimates, CAD→USD conversion, and seller locations.
        </div>
      </div>
      <div class="hero-stats">
        <div><b id="statListings">0</b><br>Listings</div>
        <div><b id="statSellers">0</b><br>Sellers</div>
      </div>
    </section>

    <div class="search-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="searchInput" placeholder="Search brake pads, alternators, winter tires...">
      </div>
      <select id="sortSelect" class="sort-select">
        <option value="newest">Newest</option>
        <option value="price_low">Price: Low → High</option>
        <option value="price_high">Price: High → Low</option>
      </select>
    </div>

    <main class="main-layout">
      <aside class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-title">Categories</div>
          <ul class="category-list" id="categoryList"></ul>
        </div>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div class="results-count" id="resultsCount">Loading listings...</div>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
